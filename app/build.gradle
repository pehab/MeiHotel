plugins { id 'com.android.application' }
android {
    namespace = 'de.meiapps.meihotel'
    compileSdk = 36
    defaultConfig {
        applicationId = 'de.meiapps.meihotel'
        minSdk = 26
        targetSdk = 36
        versionCode = providers.gradleProperty('meihotelVersionCode').getOrElse('2').toInteger()
        versionName = '0.2.0'
        testInstrumentationRunner = 'de.meiapps.meihotel.SmokeInstrumentation'
    }
    buildFeatures { buildConfig = true }
    signingConfigs {
        preview {
            if (System.getenv('MEIHOTEL_KEYSTORE_FILE')) {
                storeFile = file(System.getenv('MEIHOTEL_KEYSTORE_FILE'))
                storePassword = System.getenv('MEIHOTEL_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('MEIHOTEL_KEY_ALIAS')
                keyPassword = System.getenv('MEIHOTEL_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('MEIHOTEL_KEYSTORE_FILE')) signingConfig = signingConfigs.preview
        }
        release { minifyEnabled = true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    lint { abortOnError = true; warningsAsErrors = true }
}
dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    testImplementation 'junit:junit:4.13.2'
}
